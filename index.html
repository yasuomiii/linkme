<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Link Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>:root{
  --ed-bg:#eeeeeb;--ed-panel:#f8f8f6;--ed-card:#ffffff;--ed-line:#dcdcd6;--ed-ink:#17171a;--ed-mute:#6b6b72;--ed-acc:#2f5bff;--ed-acc-ink:#ffffff;--ed-acc-soft:#e3e9ff;--ed-ok:#12805c;--ed-warn:#b26a00;--ed-bad:#c0392b;--ed-stage:#e4e4df;--ed-shadow:0 1px 2px rgba(20,20,30,.06),0 8px 24px -12px rgba(20,20,30,.18);
  --f-d:'Bricolage Grotesque',system-ui,sans-serif;--f-b:'DM Sans',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-ed]){--ed-bg:#0e0f11;--ed-panel:#16171a;--ed-card:#1d1e22;--ed-line:#2b2d33;--ed-ink:#ececf0;--ed-mute:#9a9ca6;--ed-acc:#6d8dff;--ed-acc-ink:#0b1030;--ed-acc-soft:#1f2a55;--ed-ok:#3ecf9a;--ed-warn:#f0a43a;--ed-bad:#ff7a6b;--ed-stage:#0a0a0c;--ed-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]:not([data-ed=light]){--ed-bg:#0e0f11;--ed-panel:#16171a;--ed-card:#1d1e22;--ed-line:#2b2d33;--ed-ink:#ececf0;--ed-mute:#9a9ca6;--ed-acc:#6d8dff;--ed-acc-ink:#0b1030;--ed-acc-soft:#1f2a55;--ed-ok:#3ecf9a;--ed-warn:#f0a43a;--ed-bad:#ff7a6b;--ed-stage:#0a0a0c;--ed-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);color-scheme:dark}
:root[data-ed=dark]{--ed-bg:#0e0f11;--ed-panel:#16171a;--ed-card:#1d1e22;--ed-line:#2b2d33;--ed-ink:#ececf0;--ed-mute:#9a9ca6;--ed-acc:#6d8dff;--ed-acc-ink:#0b1030;--ed-acc-soft:#1f2a55;--ed-ok:#3ecf9a;--ed-warn:#f0a43a;--ed-bad:#ff7a6b;--ed-stage:#0a0a0c;--ed-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);color-scheme:dark}
:root[data-ed=light]{--ed-bg:#eeeeeb;--ed-panel:#f8f8f6;--ed-card:#ffffff;--ed-line:#dcdcd6;--ed-ink:#17171a;--ed-mute:#6b6b72;--ed-acc:#2f5bff;--ed-acc-ink:#ffffff;--ed-acc-soft:#e3e9ff;--ed-stage:#e4e4df;color-scheme:light}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--ed-bg);color:var(--ed-ink);font:14px/1.4 var(--f-b);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:18px;height:18px;flex:none;display:block}
:focus-visible{outline:2px solid var(--ed-acc);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:76px 360px minmax(300px,1fr) 340px;grid-template-rows:56px 1fr;grid-template-areas:"top top top top" "rail panel stage insp"}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--ed-panel);border-bottom:1px solid var(--ed-line)}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--f-d);letter-spacing:-.02em;margin-right:6px}
.brand i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,#2f5bff,#18c6c0,#ff8a3d,#2f5bff);display:block}
.top .sp{flex:1}
.save{font-size:12px;color:var(--ed-mute);display:flex;align-items:center;gap:6px}
.save::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ed-ok)}
.save.dirty::before{background:var(--ed-warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--ed-line);background:var(--ed-card);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:color-mix(in srgb,var(--ed-ink) 35%,var(--ed-line))}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ed-acc);border-color:var(--ed-acc);color:var(--ed-acc-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--ed-ink) 7%,transparent)}
.btn.danger{color:var(--ed-bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:34px;padding:0}
.btn.sm.ib{width:28px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:color-mix(in srgb,var(--ed-ink) 7%,transparent);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ed-mute);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--ed-card);color:var(--ed-ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.full{display:flex}.seg.full button{flex:1}
.rail{grid-area:rail;background:var(--ed-panel);border-right:1px solid var(--ed-line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;overflow-y:auto}
.rail button{width:62px;border:0;background:transparent;border-radius:12px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--ed-mute);transition:background .15s,color .15s}
.rail button:hover{background:color-mix(in srgb,var(--ed-ink) 6%,transparent);color:var(--ed-ink)}
.rail button.on{background:var(--ed-acc-soft);color:var(--ed-acc)}
.rail .ic{width:20px;height:20px}
.panel,.insp{background:var(--ed-panel);overflow-y:auto;overscroll-behavior:contain}
.panel{grid-area:panel;border-right:1px solid var(--ed-line)}
.insp{grid-area:insp;border-left:1px solid var(--ed-line)}
.pad{padding:16px}
.h1{font:700 22px/1.15 var(--f-d);letter-spacing:-.02em;margin:0 0 4px}
.h2{font:700 15px var(--f-d);margin:0;letter-spacing:-.01em}
.sub{color:var(--ed-mute);font-size:13px;margin:0 0 14px}
.stage{grid-area:stage;background:var(--ed-stage);display:flex;flex-direction:column;min-width:0;min-height:0;background-image:radial-gradient(color-mix(in srgb,var(--ed-ink) 14%,transparent) 1px,transparent 1px);background-size:18px 18px}
.stage-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap}
.stage-body{flex:1;min-height:0;position:relative;overflow:hidden}
.frame{position:absolute;left:50%;top:0;transform-origin:top left;background:#000;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);overflow:hidden}
.frame.mobile{border-radius:38px;border:9px solid #17171a}
.frame.tablet{border-radius:24px;border:9px solid #17171a}
.frame.desktop{border-radius:10px;border:1px solid var(--ed-line)}
.frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
.edit-col{display:contents}
.full-view{grid-area:2 / 2 / 3 / 5;overflow-y:auto;background:var(--ed-bg)}
#app[data-full] .edit-col,#app[data-full] .stage{display:none}
#app:not([data-full]) .full-view{display:none}
.wrap{max-width:1040px;margin:0 auto;padding:28px 28px 60px}
.card{background:var(--ed-card);border:1px solid var(--ed-line);border-radius:16px;padding:16px;box-shadow:var(--ed-shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font:700 28px var(--f-d);letter-spacing:-.03em}.stat span{color:var(--ed-mute);font-size:12px}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px;border-radius:12px;background:var(--ed-card);border:1px solid var(--ed-line);position:relative;transition:border-color .15s,box-shadow .15s,opacity .15s}
.row.sel{border-color:var(--ed-acc);box-shadow:0 0 0 3px var(--ed-acc-soft)}
.row.off{opacity:.55}
.row.head{background:transparent;border-style:dashed}
.row .gr{width:22px;height:30px;display:grid;place-items:center;color:var(--ed-mute);cursor:grab;touch-action:none;border-radius:6px;border:0;background:none}
.row .gr:active{cursor:grabbing}
.row .gi{width:32px;height:32px;border-radius:9px;background:color-mix(in srgb,var(--ed-ink) 7%,transparent);display:grid;place-items:center;flex:none}
.row .tt{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}
.row .tt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt small{display:block;color:var(--ed-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.row.drag{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:none;opacity:.96}
.row.ind{margin-left:16px}
.tg{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tg span{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--ed-ink) 22%,transparent);transition:background .2s}
.tg span::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked+span{background:var(--ed-acc)}
.tg input:checked+span::after{transform:translateX(16px)}
.tg input:focus-visible+span{outline:2px solid var(--ed-acc);outline-offset:2px}
.ctl{padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--ed-line) 60%,transparent)}
.ctl:last-child{border-bottom:0}
.ctl-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-height:20px}
.ctl-h label{font-weight:500;font-size:13px;flex:1}
.ctl-h .val{font-size:12px;color:var(--ed-mute);font-variant-numeric:tabular-nums}
.ctl.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}.ctl.inline .ctl-h{margin:0;flex:1}
.rs{border:0;background:none;color:var(--ed-mute);width:20px;height:20px;padding:0;display:grid;place-items:center;border-radius:6px}
.rs:hover{background:color-mix(in srgb,var(--ed-ink) 8%,transparent);color:var(--ed-ink)}
.rs .ic{width:13px;height:13px}
.rs[hidden]{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:color-mix(in srgb,var(--ed-ink) 16%,transparent)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:color-mix(in srgb,var(--ed-ink) 16%,transparent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ed-card);border:2px solid var(--ed-acc);margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ed-card);border:2px solid var(--ed-acc)}
.in,select.in,textarea.in{width:100%;height:34px;border-radius:9px;border:1px solid var(--ed-line);background:var(--ed-card);padding:0 10px}
textarea.in{height:auto;padding:8px 10px;resize:vertical;min-height:70px;line-height:1.45}
.in:focus{outline:2px solid var(--ed-acc);outline-offset:-1px;border-color:transparent}
.clr{display:flex;gap:8px;align-items:center}
.clr .sw{width:34px;height:34px;border-radius:9px;border:1px solid var(--ed-line);position:relative;overflow:hidden;background:var(--c);flex:none;box-shadow:inset 0 0 0 2px var(--ed-card)}
.clr .sw input{position:absolute;inset:-6px;width:60px;height:60px;opacity:0;cursor:pointer}
.clr .hex{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;text-transform:lowercase}
.clr .auto{font-size:12px;color:var(--ed-mute)}
.sec{margin:0 0 10px;border:1px solid var(--ed-line);border-radius:14px;background:var(--ed-card);overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ed-mute);border-bottom:2px solid var(--ed-mute);transform:rotate(45deg);transition:transform .2s}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec>.in-sec{padding:2px 14px 12px}
.cats{display:flex;flex-direction:column;gap:6px}
.cat{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;border:1px solid var(--ed-line);background:var(--ed-card);text-align:left;width:100%}
.cat:hover{border-color:color-mix(in srgb,var(--ed-ink) 30%,var(--ed-line))}
.cat.on{border-color:var(--ed-acc);box-shadow:0 0 0 3px var(--ed-acc-soft)}
.cat .gi{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--ed-ink) 7%,transparent);display:grid;place-items:center}
.cat.on .gi{background:var(--ed-acc);color:#fff}
.cat b{display:block;font-weight:600}.cat small{color:var(--ed-mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--ed-line);background:var(--ed-card);font-size:13px}
.chip.on{background:var(--ed-acc);border-color:var(--ed-acc);color:#fff}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.picks button{height:38px;border-radius:10px;border:1px solid var(--ed-line);background:var(--ed-card);display:grid;place-items:center}
.picks button.on{border-color:var(--ed-acc);background:var(--ed-acc-soft);color:var(--ed-acc)}
.picks button:hover{border-color:var(--ed-acc)}
.lay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lay{border:1px solid var(--ed-line);background:var(--ed-card);border-radius:12px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.lay.on{border-color:var(--ed-acc);box-shadow:0 0 0 3px var(--ed-acc-soft)}
.lay svg{width:100%;height:44px;color:var(--ed-mute)}.lay.on svg{color:var(--ed-acc)}
.sty-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sty{height:62px;border-radius:12px;border:1px solid var(--ed-line);display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#3b2f7a,#13486b);font-size:12px;font-weight:600;color:#fff}
.sty.on{outline:3px solid var(--ed-acc);outline-offset:1px}
.sty i{display:block;padding:7px 14px;font-style:normal}
.sty[data-s=liquid] i{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sty[data-s=solid] i{background:#f5f6fb;color:#111;border-radius:8px}
.sty[data-s=outline] i{border:2px solid #fff;border-radius:8px}
.sty[data-s=gradient] i{background:linear-gradient(120deg,#8b7bff,#4cc9f0);border-radius:10px}
.sty[data-s=minimal] i{border-bottom:1px solid rgba(255,255,255,.6)}
.sty[data-s=floating] i{background:#20233a;border-radius:11px;box-shadow:0 12px 20px -6px rgba(0,0,0,.6)}
.sty[data-s=neon] i{border:2px solid #00f0ff;border-radius:8px;box-shadow:0 0 12px #00f0ff,inset 0 0 8px rgba(0,240,255,.4);text-shadow:0 0 8px #00f0ff}
.sty[data-s=soft] i{background:#2b2f50;border-radius:14px;box-shadow:5px 5px 10px rgba(0,0,0,.4),-4px -4px 9px rgba(255,255,255,.07)}
.sty[data-s="3d"] i{background:#ffb347;color:#2a1300;border-radius:9px;box-shadow:0 4px 0 #c77a1e}
.sty[data-s=elegant] i{border:1px solid rgba(255,255,255,.6);letter-spacing:.14em;font-size:10px;text-transform:uppercase}
.sty[data-s=custom] i{background:rgba(255,255,255,.25);border-radius:6px;border:1px dashed #fff}
.media{display:flex;gap:10px;align-items:center}
.media .th{width:54px;height:54px;border-radius:12px;border:1px dashed var(--ed-line);background:color-mix(in srgb,var(--ed-ink) 5%,transparent) center/cover no-repeat;display:grid;place-items:center;color:var(--ed-mute);flex:none;overflow:hidden}
.media .th video{width:100%;height:100%;object-fit:cover}
.media .col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.media.drop-on .th{border-color:var(--ed-acc);background-color:var(--ed-acc-soft)}
.note{font-size:12px;color:var(--ed-mute);line-height:1.45;margin:6px 0 0}
.note.warn{color:var(--ed-warn)}
.hint{display:flex;gap:8px;padding:10px 12px;border-radius:12px;background:var(--ed-acc-soft);color:color-mix(in srgb,var(--ed-acc) 80%,var(--ed-ink));font-size:12.5px}
.hint .ic{width:16px;height:16px;margin-top:1px}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--ed-ink) 8%,transparent)}
.pill.ok{background:color-mix(in srgb,var(--ed-ok) 16%,transparent);color:var(--ed-ok)}.pill.warn{background:color-mix(in srgb,var(--ed-warn) 18%,transparent);color:var(--ed-warn)}.pill.bad{background:color-mix(in srgb,var(--ed-bad) 16%,transparent);color:var(--ed-bad)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--ed-line) 60%,transparent)}
.chk:last-child{border-bottom:0}.chk .pill{margin-top:1px}.chk b{display:block;font-weight:600}.chk span{color:var(--ed-mute);font-size:12.5px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ed-acc) calc(var(--p)*1%),color-mix(in srgb,var(--ed-ink) 10%,transparent) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--ed-card)}
.ring b{position:relative;z-index:1;font:700 22px var(--f-d)}
.th-grid{align-items:stretch;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.thc{background:var(--ed-card);border:1px solid var(--ed-line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.thc.on{border-color:var(--ed-acc);box-shadow:0 0 0 3px var(--ed-acc-soft)}
.thc .pv{height:210px;border-radius:11px;overflow:hidden;position:relative;background:#111}
.thc iframe{position:absolute;left:0;top:0;width:390px;height:620px;border:0;transform:scale(.34);transform-origin:top left;pointer-events:none;background:#111}
.thc b{font-weight:600}.thc small{color:var(--ed-mute);font-size:12px;display:block}
.thc .acts{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,20,.5);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--ed-panel);border:1px solid var(--ed-line);border-radius:18px;padding:20px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h3{margin:0 0 6px;font:700 19px var(--f-d)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.files{max-height:220px;overflow:auto;border:1px solid var(--ed-line);border-radius:10px;background:var(--ed-card);font:12px ui-monospace,Menlo,monospace}
.files div{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;border-bottom:1px solid color-mix(in srgb,var(--ed-line) 60%,transparent)}
.files div:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17171a;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90vw}
.mobile-bar{display:none;flex-wrap:nowrap}
.empty{color:var(--ed-mute);text-align:center;padding:26px 10px;border:1px dashed var(--ed-line);border-radius:14px}
.kbd{font:11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;border:1px solid var(--ed-line);background:var(--ed-card)}
@media (max-width:1239px){

}

html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;font-family:var(--font-b);color:var(--text);background:var(--bg1);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.4}
a{color:inherit}
button{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;flex:none;display:block}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg1);pointer-events:none}
#bg>*{position:absolute;inset:0}
.bg-media{background-size:cover;background-repeat:no-repeat}
.bg-media video{width:100%;height:100%;object-fit:cover}
.bg-orbs i,.bg-mesh i{position:absolute;border-radius:50%;-webkit-mask-image:radial-gradient(closest-side,#000 0,rgba(0,0,0,.75) 55%,transparent 100%);mask-image:radial-gradient(closest-side,#000 0,rgba(0,0,0,.75) 55%,transparent 100%);will-change:transform;contain:strict}
.bg-ov{background:var(--overlay)}
.bg-grain{mix-blend-mode:overlay;background-size:180px}
#pc{width:100%;height:100%}
#cglow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s}
#cglow.on{opacity:1}
.page{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-left:20px;padding-right:20px}
.shell{width:100%;max-width:var(--maxw);display:flex;flex-direction:column;gap:var(--sec-gap,28px);margin:0 auto}
.shell.split{flex-direction:row;align-items:flex-start;gap:64px}
.shell.split-r{flex-direction:row-reverse;align-items:flex-start;gap:64px}
.split .profile,.split-r .profile{position:sticky;top:48px;flex:0 0 340px;align-items:flex-start;text-align:left}
.split .main,.split-r .main{flex:1;min-width:0}
.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.profile{display:flex;flex-direction:column;align-items:var(--p-ai);text-align:var(--p-ta);gap:var(--p-gap)}
.tools{position:fixed;top:14px;right:14px;z-index:5;display:flex;gap:8px}
.tool{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--text);border:1px solid color-mix(in srgb,var(--text) 18%,transparent);background:color-mix(in srgb,var(--text) 8%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .3s var(--ease),background .3s}
.tool:hover{transform:scale(1.08)}
.tool .ic{width:19px;height:19px}
.tool .moon{display:none}[data-theme=light] .tool .moon{display:block}[data-theme=light] .tool .sun{display:none}
/* avatar */
.avw{position:relative;filter:drop-shadow(0 calc(var(--av-sh)*.28px) calc(var(--av-sh)*.6px) rgba(0,0,0,calc(var(--av-sh)*.012))) drop-shadow(0 0 calc(var(--av-gl)*1px) color-mix(in srgb,var(--glow) 80%,transparent))}
.av{width:var(--av-size);height:var(--av-size);padding:var(--av-bw);background:var(--av-bc);display:block;overflow:hidden;${'' /* shape injected */}}
.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;clip-path:inherit}
.av .ini{width:100%;height:100%;display:grid;place-items:center;font:700 calc(var(--av-size)*.4)/1 var(--font-h);color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:inherit;clip-path:inherit}
.av.an-ring{background:conic-gradient(from var(--ang),var(--accent),var(--accent2),transparent 55%,var(--accent));animation:spin 4s linear infinite;padding:max(var(--av-bw),3px)}
.avw.an-float{animation:floaty 5s ease-in-out infinite}
.avw.an-breathe{animation:breathe 4s ease-in-out infinite}
.avw.an-pulse{animation:glowp 2.6s ease-in-out infinite}
.avw.an-tilt{transition:transform .3s var(--ease)}
.name{margin:0;font-family:var(--font-h);font-size:var(--n-size);font-weight:var(--n-w);letter-spacing:-.02em;line-height:1.1;color:var(--n-color);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:var(--p-ai)}
.name.fx-gradient .nt{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.name.fx-shimmer .nt{background:linear-gradient(110deg,var(--text) 30%,var(--accent) 50%,var(--text) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 4s linear infinite}
.vf{width:.72em;height:.72em;color:var(--accent2)}
.handle{color:var(--muted);font-size:14px;font-weight:500;margin-top:-4px}
.bio{margin:0;color:var(--b-color);font-size:var(--bio-size);max-width:var(--bio-w);line-height:1.55;white-space:pre-line}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:var(--p-ai)}
.badge{--bc:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--bc) 16%,transparent);color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 36%,transparent)}
.badge .ic{width:13px;height:13px}
.socials{display:flex;flex-wrap:wrap;gap:10px;justify-content:var(--p-ai)}
.soc{width:var(--so-size);height:var(--so-size);border-radius:calc(var(--so-size)*.34);display:grid;place-items:center;color:var(--text);text-decoration:none;transition:transform .3s var(--ease),background .3s,box-shadow .3s}
.soc .ic{width:calc(var(--so-size)*.46);height:calc(var(--so-size)*.46)}
.soc:hover{transform:translateY(-3px) scale(1.06)}
.so-glass .soc{background:color-mix(in srgb,var(--text) 9%,transparent);border:1px solid color-mix(in srgb,var(--text) 16%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.so-filled .soc{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.so-outline .soc{border:1.5px solid color-mix(in srgb,var(--text) 40%,transparent)}
.so-plain .soc{opacity:.85}.so-plain .soc:hover{opacity:1}
.so-round .soc{border-radius:50%}
/* links grid */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}
.grp{grid-column:1/-1;display:flex;flex-direction:column;gap:var(--gap)}
.grp-h{display:flex;align-items:center;gap:12px;font-family:var(--font-b);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;background:none;border:0;padding:6px 2px;text-align:left;width:100%}
.grp-h::after{content:'';flex:1;height:1px;background:color-mix(in srgb,var(--muted) 28%,transparent)}
button.grp-h{cursor:pointer;padding:13px 16px;border-radius:calc(var(--b-r)*.8 + 2px);background:color-mix(in srgb,var(--text) 7%,transparent);border:1px solid color-mix(in srgb,var(--text) 15%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--text);font-size:13px;letter-spacing:.1em;transition:background .3s,border-color .3s,transform .3s var(--ease)}
button.grp-h::after{display:none}
button.grp-h span{flex:1}
button.grp-h:hover{background:color-mix(in srgb,var(--text) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
button.grp-h:active{transform:scale(.985)}
button.grp-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.grp-h .ic{width:18px;height:18px;order:0;transition:transform .45s var(--ease)}
.grp{transition:gap .45s var(--ease)}.grp.closed{gap:0}
.grp.closed .grp-in{opacity:0}.grp-in{transition:opacity .35s ease}
.grp.closed .grp-h .ic{transform:rotate(-90deg)}
.grp:not(.closed) .grp-h .ic{transform:rotate(0)}
.grp-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease)}
.grp.closed .grp-wrap{grid-template-rows:0fr}
.grp-in{overflow:hidden;min-height:0;padding:10px;margin:-10px}
.grp.closed .grp-in{visibility:hidden;transition:visibility 0s .45s}
.it{display:flex;justify-content:center;min-width:0}
.sp-2x1{grid-column:span 2}.sp-2x2{grid-column:span 2;grid-row:span 2}.sp-1x2{grid-row:span 2}
.bento{grid-auto-flow:dense;grid-auto-rows:var(--row)}
.bento .grp{grid-auto-rows:auto}
.bento>.profile{grid-column:span 2;grid-row:span 2;padding:26px;border-radius:calc(var(--b-r) + 6px);background:color-mix(in srgb,var(--text) 6%,transparent);border:1px solid color-mix(in srgb,var(--text) 14%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);justify-content:center}
.bento>.profile .av{width:calc(var(--av-size)*.7);height:calc(var(--av-size)*.7)}
.bento>.profile .badges{display:none}
.bento>.profile .bio{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bento>.profile{gap:8px;padding:20px;overflow:hidden}
/* link base */
.lk{--ic-w:calc(var(--b-h)*.6);--fill:color-mix(in srgb,var(--b-bg) calc(var(--b-op)*1%),transparent);position:relative;display:flex;flex-direction:column;width:var(--b-w);min-width:0;color:var(--b-text);text-decoration:none;font-family:var(--font-btn);font-size:var(--b-fs);font-weight:var(--b-fw);border-radius:var(--b-r);overflow:hidden;isolation:isolate;cursor:pointer;-webkit-tap-highlight-color:transparent;border:var(--b-bw) solid transparent;transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .35s,color .3s,border-color .3s,filter .3s;outline-offset:3px;${'' }
}
.lk:focus-visible{outline:2px solid var(--accent)}
.lk-row{display:flex;align-items:center;gap:12px;min-height:var(--b-h);padding:0 var(--b-px);width:100%;min-width:0}
.lk-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:var(--b-ta);line-height:1.2}
.lk-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${'' }}
.lk-up .lk-t{text-transform:uppercase;letter-spacing:.12em;font-size:.86em}
.lk-s{font-size:.78em;font-weight:400;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-ic{width:var(--ic-w);height:var(--ic-w);flex:none;display:grid;place-items:center;color:var(--ic-color,inherit)}
.lk-ic .ic{width:var(--b-is);height:var(--b-is)}
.ibox .lk-ic{border-radius:calc(var(--b-r)*.55);background:color-mix(in srgb,var(--ic-color,var(--b-text)) 12%,transparent)}
.lk-ar{width:var(--ic-w);flex:none;display:grid;place-items:center;opacity:.55;transition:transform .35s var(--ease),opacity .3s}
.lk-ar .ic{width:18px;height:18px}
.lk-sp{width:var(--ic-w);flex:none}
.lk:hover .lk-ar{opacity:1;transform:translate(2px,-2px)}
.lk-th{display:block;background-size:cover;background-position:center;background-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.lk-bd{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.v-bar .lk-th{display:none}
.v-bar.has-th .lk-ic{background-size:cover;background-position:center;border-radius:calc(var(--b-r)*.55);overflow:hidden}
.v-tile{min-height:calc(var(--b-h)*2)}
.v-tile .lk-row{flex-direction:column;justify-content:center;text-align:center;padding:18px 12px;gap:10px;min-height:calc(var(--b-h)*2)}
.v-tile .lk-tx{flex:none;align-items:center;text-align:center;width:100%}

.v-tile .lk-ic{width:calc(var(--b-h)*.8);height:calc(var(--b-h)*.8)}

.v-tile .lk-bd{position:absolute;top:10px;right:10px}
.v-card .lk-th{aspect-ratio:16/9;width:100%;position:relative}
.v-card:not(.has-th) .lk-th{display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 40%,transparent),color-mix(in srgb,var(--accent2) 30%,transparent))}
.v-card:not(.has-th) .lk-th .ic{width:44px;height:44px;opacity:.9}
.v-card .lk-tx{text-align:left}
.v-bento{height:100%;width:100%}
.v-bento .lk-th{position:absolute;inset:0;z-index:-2}
.v-bento.has-th::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.65))}
.v-bento.has-th{color:#fff}
.v-bento .lk-row{flex-direction:column;align-items:flex-start;justify-content:space-between;height:100%;padding:16px 18px;gap:8px}
.v-bento .lk-ic{width:calc(var(--b-h)*.8);height:calc(var(--b-h)*.8)}
.v-bento .lk-ic .ic{width:calc(var(--b-is)*1.35);height:calc(var(--b-is)*1.35)}
.v-bento .lk-tx{flex:none;width:100%;text-align:left}
.v-bento .lk-t{white-space:normal;font-size:1.08em}
.v-bento .lk-ar{position:absolute;top:14px;right:14px;width:auto}
.v-bento .lk-sp{display:none}
.v-bento .lk-bd{position:absolute;top:14px;left:auto;right:46px}
.v-text{background:none!important;border-radius:0!important;border-width:0 0 1px 0!important;border-style:solid!important;border-color:color-mix(in srgb,var(--text) 16%,transparent)!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.v-text::before,.v-text::after{display:none!important}
.v-text .lk-row{min-height:calc(var(--b-h)*.82);padding-left:2px;padding-right:2px}
.v-text .lk-tx{text-align:left}
.v-text:hover{border-color:var(--accent)!important;padding-left:6px}

.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px;opacity:.85}
.page>.foot{margin-top:auto;padding-top:36px}
.sel-flash{outline:2px solid var(--accent)!important;outline-offset:4px;animation:selp 1.2s ease 2}

/* entrance */
.rv{animation:var(--ev) var(--dur) var(--ease) calc(var(--d0) + var(--i,0)*var(--stagger)) backwards}

.nointro .rv{animation:none!important}

@keyframes e-up{from{opacity:0;transform:translateY(26px)}}
@keyframes e-fade{from{opacity:0}}
@keyframes e-sl{from{opacity:0;transform:translateX(-36px)}}
@keyframes e-sr{from{opacity:0;transform:translateX(36px)}}
@keyframes e-zoom{from{opacity:0;transform:scale(.86)}}
@keyframes e-blur{from{opacity:0;filter:blur(14px);transform:scale(1.04)}}
@keyframes e-flip{from{opacity:0;transform:perspective(600px) rotateX(-40deg) translateY(16px)}}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(22);opacity:0}}
@keyframes spin{to{--ang:360deg}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.05}}
@keyframes glowp{0%,100%{filter:drop-shadow(0 8px 14px rgba(0,0,0,.3)) drop-shadow(0 0 8px color-mix(in srgb,var(--glow) 60%,transparent))}50%{filter:drop-shadow(0 8px 14px rgba(0,0,0,.3)) drop-shadow(0 0 30px var(--glow))}}
@keyframes shim{to{background-position:-250% 0}}
@keyframes gshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.025}}
@keyframes wiggle{0%,86%,100%{rotate:0deg}90%{rotate:-1.6deg}94%{rotate:1.6deg}98%{rotate:-1deg}}
@keyframes shake{0%,84%,100%{translate:0 0}88%{translate:-4px 0}92%{translate:4px 0}96%{translate:-2px 0}}
@keyframes bobble{0%,100%{translate:0 0}40%{translate:0 -5px}60%{translate:0 0}75%{translate:0 -2px}}
@keyframes glowb{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 14px var(--glow))}}
@keyframes heart{0%,100%{scale:1}14%{scale:1.035}28%{scale:1}42%{scale:1.035}70%{scale:1}}

@keyframes flash{0%{filter:brightness(1)}30%{filter:brightness(1.7)}100%{filter:brightness(1)}}
@keyframes selp{50%{outline-color:transparent}}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,8vh) scale(1.15)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-14vw,-6vh) scale(.9)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(8vw,-12vh) scale(1.2)}}

@media (max-width:860px){.shell.split,.shell.split-r{flex-direction:column;gap:28px}.split .profile,.split-r .profile{position:static;flex:none;align-items:center;text-align:center}}

function linkHtml(it, idx, S, L, ctx, group) {

  else if (icn && iconPos !== 'none') ic = '<span class="lk-ic">' + icn + '</span>';
  const th = (L.variant === 'card' || L.variant === 'bento') ? '<span class="lk-th"' + (thumb ? ' style="background-image:url(\'' + esc(thumb) + '\')"' : '') + '>' + (!thumb && L.variant === 'card' ? icn : '') + '</span>' : '';

}

function profileHtml(S, L, ctx, idx) {

function socialsHtml(S, idx) {

  if (!list.length) return '';

  return '<nav class="socials so-' + st + ' rv" style="--i:' + idx + '" aria-label="Social Media">' + list.map(s => '<a class="soc" data-id="' + esc(s.id) + '" data-edit="social" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(PLATFORM_LABEL[s.platform] || s.platform) + '">' + ico(s.platform) + '</a>').join('') + '</nav>';

function linksHtml(S, L, ctx, startIdx) {
  let idx = startIdx, out = '', open = null;
  const closeGroup = () => { if (open) { out += '</div></div></div></div>'; open = null; } };
  const gridCls = 'grid' + (L.bento ? ' bento' : '') + (L.cols === 3 ? ' g3' : '');
  for (const it of S.items) {
    if (it.type === 'heading') {
      closeGroup();
      const coll = it.collapsible;
      out += '<div class="grp' + (coll && it.closed ? ' closed' : '') + '" data-id="' + esc(it.id) + '">';
      out += coll ? '<button class="grp-h rv" style="--i:' + (idx++) + '" data-grp aria-expanded="' + (it.closed ? 'false' : 'true') + '"><span>' + esc(it.title) + '</span>' + ico('chev') + '</button>' : '<div class="grp-h rv" style="--i:' + (idx++) + '"><span>' + esc(it.title) + '</span></div>';

    out += linkHtml(it, idx++, S, L, ctx);

function siteBody(S, ctx) {

  if (bg.type === 'video' && bg.video) h += '<div class="bg-media"><video src="' + esc(ctx.res(bg.video, 'video')) + '" autoplay muted loop playsinline' + (ctx.thumb ? ' preload="none"' : '') + '></video></div>';
  if (bg.orbs) h += '<div class="bg-orbs">' + '<i></i>'.repeat(clamp(bg.orbCount, 1, 5)) + '</div>';
  if (bg.pType !== 'none') h += '<canvas id="pc"></canvas>';
  h += '<div class="bg-ov"></div>' + (bg.grain ? '<div class="bg-grain"></div>' : '') + (bg.vignette > 0 ? '<div class="bg-vig"></div>' : '') + '</div>';
  h += '<div id="cglow"></div>';

  h += '<main class="page lay-' + d.layout.type + '">';
  const profile = profileHtml(S, L, ctx);

  if (L.bento) {

Statische Link-in-Bio-Seite, erstellt mit dem Link Studio. Kein Backend, kein Build-Schritt. Die Seite besteht nur aus diesen Dateien (${files.length} Dateien, ${(sz / 1024).toFixed(0)} KB).

## Veröffentlichen auf GitHub Pages

1. Auf GitHub ein neues Repository anlegen. Der Name wird Teil der Adresse. Für \`https://DEINNAME.github.io/\` heißt das Repo \`DEINNAME.github.io\`. Jeder andere Name ergibt \`https://DEINNAME.github.io/REPO/\`.
2. Den **Inhalt** dieser ZIP-Datei (nicht den Ordner selbst) in das Repository hochladen. \`index.html\` muss im Hauptverzeichnis liegen.
3. Im Repository **Settings → Pages**: Source = *Deploy from a branch*, Branch = \`main\`, Ordner = \`/ (root)\`. Speichern.
4. Nach ein bis zwei Minuten ist die Seite unter der angezeigten Adresse erreichbar.

Alle Pfade sind relativ. Die Seite funktioniert deshalb auch unter \`/REPO/\`.

## Eigene Domain

Im Studio unter *Einstellungen* eine Domain eintragen und neu exportieren. Die Datei \`CNAME\` wird dann erzeugt. Anschließend DNS bei deinem Domain-Anbieter auf GitHub Pages zeigen lassen (siehe GitHub-Dokumentation).

## Dateien

- \`index.html\` – die Seite
- \`assets/css/style.css\` – alle Styles
- \`assets/js/main.js\` – Animationen, Partikel, Theme-Wechsel
- \`assets/img\`, \`assets/video\`, \`assets/fonts\` – deine Medien
- \`404.html\`, \`robots.txt\`, \`.nojekyll\` – Hilfsdateien für GitHub Pages

Schriftarten aus Google Fonts werden beim Aufruf von fonts.googleapis.com geladen. Wer das vermeiden will, lädt im Studio eine eigene Schriftdatei hoch.
`;

function lum(hex) { const c = LB.hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }

function blend(fg, bg, a) { const f = LB.hexToRgb(fg), g = LB.hexToRgb(bg); return '#' + f.map((v, i) => Math.round(v * a + g[i] * (1 - a)).toString(16).padStart(2, '0')).join(''); }
function healthChecks() {
  const out = [], add = (level, title, desc) => out.push({ level, title, desc });
  const links = S.items.filter(i => i.type === 'link'), act = links.filter(l => l.enabled);
  add(S.profile.name.trim() ? 'ok' : 'bad', 'Name', S.profile.name.trim() ? 'Dein Name ist gesetzt.' : 'Trage unter Profil einen Namen ein.');
  add(S.profile.avatar ? 'ok' : 'warn', 'Profilbild', S.profile.avatar ? 'Profilbild vorhanden.' : 'Ohne Bild erscheint nur ein Buchstabe.');
  add(act.length ? 'ok' : 'bad', 'Aktive Links', act.length + ' von ' + links.length + ' Links sind sichtbar.');
  const badUrl = act.filter(l => !/^(https?:\/\/|mailto:|tel:)\S+/i.test((l.url || '').trim()));
  add(badUrl.length ? 'bad' : 'ok', 'Link-Adressen', badUrl.length ? badUrl.length + ' Link(s) ohne gültige URL: ' + badUrl.map(l => l.title || 'Ohne Titel').slice(0, 3).join(', ') : 'Alle URLs sind gültig.');
  const seen = {}, dup = []; act.forEach(l => { const u = (l.url || '').trim().toLowerCase(); if (seen[u]) dup.push(l.title); seen[u] = 1; });
  add(dup.length ? 'warn' : 'ok', 'Doppelte Ziele', dup.length ? 'Mehrfach verwendet: ' + dup.slice(0, 3).join(', ') : 'Keine doppelten URLs.');
  const empty = act.filter(l => !(l.title || '').trim());
  add(empty.length ? 'warn' : 'ok', 'Titel', empty.length ? empty.length + ' Link(s) ohne Titel.' : 'Alle Links haben einen Titel.');
  const t = S.meta.title.length, dsc = S.meta.description.length;
  add(t >= 10 && t <= 60 ? 'ok' : 'warn', 'Seitentitel', t + ' Zeichen. Gut sind 10 bis 60.');
  add(dsc >= 50 && dsc <= 160 ? 'ok' : 'warn', 'Meta-Beschreibung', dsc + ' Zeichen. Gut sind 50 bis 160.');
  ['dark', 'light'].forEach(m => {
    const p = S.design.pal[m], op = clamp(p.btnOp, 0, 100) / 100;
    const cT = contrast(p.text, p.bg1), cM = contrast(p.muted, p.bg1), btnBg = blend(p.btnBg, p.bg1, op), cB = contrast(p.btnText, S.design.button.style === 'outline' || S.design.button.style === 'minimal' || S.design.button.style === 'elegant' ? p.bg1 : btnBg);
    const worst = Math.min(cT, cM, cB);
    add(worst >= 4.5 ? 'ok' : worst >= 3 ? 'warn' : 'bad', 'Kontrast ' + mname(m), 'Text ' + cT.toFixed(1) + ':1 · gedämpft ' + cM.toFixed(1) + ':1 · Button ' + cB.toFixed(1) + ':1 (empfohlen ab 4.5:1; bei Verläufen grobe Schätzung)');
  });
  const mb = [...referencedMedia()].reduce((a, id) => a + ((media.get(id) || {}).size || 0), 0);
  add(mb > 15e6 ? 'warn' : 'ok', 'Datenmenge', 'Medien im Export: ' + fmtSize(mb) + (mb > 15e6 ? '. Das lädt auf Mobilgeräten langsam.' : '.'));
  add(S.meta.ogImage && !S.meta.siteUrl ? 'warn' : 'ok', 'Link-Vorschau', S.meta.ogImage ? (S.meta.siteUrl ? 'Vorschaubild und Seiten-URL gesetzt.' : 'Für das Vorschaubild in Messengern wird die Seiten-URL benötigt.') : 'Kein Vorschaubild (optional).');
  return out;
}

function startDrag(e, grip) {

    rows.forEach((r, i) => { if (i === from) return; const mid = rects[i].top + rects[i].height / 2; if (i > from && cy > mid) to = Math.max(to, i); if (i < from && cy < mid) to = Math.min(to, i); });
    rows.forEach((r, i) => { if (i === from) return; let sh = 0; if (from < to && i > from && i <= to) sh = -h; if (from > to && i < from && i >= to) sh = h; r.style.transition = 'transform .15s'; r.style.transform = sh ? 'translateY(' + sh + 'px)' : ''; });

    if (to !== from) mutate(s => { const [x] = s[list].splice(from, 1); s[list].splice(to, 0, x); }, 'sort');

async function handleFile(path, file, d) {
  if (!file) return;
  try {
    if (d.kind === 'image' && !file.type.startsWith('image/')) { toast('Bitte eine Bilddatei wählen.'); return; }
    if (d.kind === 'video' && !file.type.startsWith('video/')) { toast('Bitte MP4 oder WebM wählen.'); return; }
    const id = await addMedia(file, { kind: d.kind, max: +d.max || 1600, square: d.sq === '1', keepAlpha: d.alpha === '1' });
    setv(path, 'm:' + id); renderEditing();
    if (d.kind === 'video' && file.size > 20e6) toast('Hinweis: Das Video ist größer als 20 MB.');
  } catch (e) { toast('Datei konnte nicht gelesen werden.'); }
}

    case 'resetcat': mutate(s => { (CAT_KEYS[ui.cat] || []).forEach(k => { s.design[k] = clone(DEFAULT_DESIGN[k]); }); }); renderAll(); break;
    case 'copypal': { const from = ui.pmode === 'dark' ? 'light' : 'dark'; mutate(s => { s.design.pal[ui.pmode] = clone(s.design.pal[from]); }); renderInsp(); break; }
    case 'replay': ui.introDone = false; toPreview({ t: 'replay' }); break;
    case 'export': openExport(); break;
    case 'saveproject': { const r = await saveFile((slug(S.profile.name) || 'projekt') + '.link-studio.json', await projectToFile()); if (r === 'saved' || r === 'anchor') toast('Projekt gesichert'); break; }
    case 'loadproject': pickFile('.json,application/json', async f => { if (f) loadProjectText(await f.text()); }); break;
    case 'resetall': if (await ask('Alles zurücksetzen?', 'Seite, Themes und Medien werden auf den Startzustand gesetzt. Sichere vorher dein Projekt, wenn du etwas behalten willst.', 'Alles zurücksetzen', true)) { S = LB.fresh(); themes = []; ui.sel = null; hpush(null); renderAll(); changed(); } break;
    case 'edtheme': ui.ed = val; applyEd(); scheduleSave(); renderMain(); break;
  }
}
function applyEd() { if (ui.ed === 'auto') document.documentElement.removeAttribute('data-ed'); else document.documentElement.setAttribute('data-ed', ui.ed); }

/* ---------- events ---------- */
function onField(e) {
  const el = e.target.closest && e.target.closest('[data-path]'); if (!el || el.tagName === 'BUTTON') return;
  const p = el.dataset.path, t = el.dataset.t; let v;
  if (t === 'num') { v = parseFloat(el.value); if (isNaN(v)) return; }
  else if (t === 'bool') v = el.checked;
  else if (t === 'hex') { v = el.value.trim(); if (v && !/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) return; }
  else if (t === 'url') { v = el.value.trim(); if (!v && String(getPath(S, p) || '').startsWith('m:')) return; }
  else v = el.value;
  if (typeof getPath(S, p) === 'undefined' && p.indexOf('.o.') < 0 && p.indexOf('meta') !== 0 && p.indexOf('design') !== 0 && p.indexOf('profile') !== 0 && p.indexOf('socials') !== 0 && p.indexOf('items') !== 0) return;
  setv(p, v);
  $$('[data-path="' + p + '"]').forEach(x => { if (x === el || x.tagName === 'BUTTON') return; if (x.type === 'color') x.value = hexOf(v); else if (x.type === 'checkbox') x.checked = !!v; else x.value = v; });
  const clr = el.closest('.clr'); if (clr) { const sw = $('.sw', clr); if (sw) sw.style.setProperty('--c', v || 'transparent'); }
  const vl = $('[data-val="' + p + '"]'); if (vl) vl.textContent = v + (vl.dataset.unit || '');
  const rs = $('.rs[data-reset="' + p + '"]'); if (rs) rs.hidden = isDef(p);
  refreshRowText(p);
  const rr = el.dataset.rr;
  if (rr === 'insp') renderInsp(); else if (rr === 'panel') renderPanel(); else if (rr === 'view') renderMain(); else if (rr === 'all') renderEditing();
  if (p === 'profile.name' || p.indexOf('design.fonts') === 0 || p.indexOf('design.layout') === 0 || p.indexOf('design.button.style') === 0) { const cs = $$('.cat small'); if (cs.length) { renderPanel(); } }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { const f = e.target.closest && e.target.closest('input.fi'); if (!f) return; const box = f.closest('.media'), file = f.files[0]; handleFile(box.dataset.drop, file, box.dataset); setTimeout(() => { f.value = ''; }, 500); });
document.addEventListener('pointerdown', e => { const g = e.target.closest && e.target.closest('[data-grip]'); if (g && e.button === 0) startDrag(e, g); });
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('[data-grip]');
  if (g && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); const li = g.closest('li'), list = li.parentElement.dataset.sort; if (moveItem(list, li.dataset.id, e.key === 'ArrowUp' ? -1 : 1)) { renderPanel(); const n = $('.row[data-id="' + li.dataset.id + '"] [data-grip]'); if (n) n.focus(); } return; }
  const mod = e.metaKey || e.ctrlKey, tag = (e.target.tagName || '').toLowerCase();
  if (mod && e.key.toLowerCase() === 'z' && tag !== 'textarea' && !(tag === 'input' && ['text', 'url', ''].includes(e.target.type || ''))) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
});
document.addEventListener('click', e => {
  const t = e.target;
  let el;
  if (t.closest('#undo')) { undo(); return; }
  if (t.closest('#redo')) { redo(); return; }
  if ((el = t.closest('[data-nav]'))) { ui.section = el.dataset.nav; ui.view = 'edit'; if (ui.section === 'design' && !ui.cat) ui.cat = 'layout'; renderAll(); return; }
  if ((el = t.closest('[data-view]')) && el.closest('#viewSeg')) { ui.view = el.dataset.view; renderMain(); syncToolbar(); setTimeout(fitFrame, 30); return; }
  if ((el = t.closest('[data-dev]'))) { ui.device = el.dataset.dev; syncToolbar(); return; }
  if ((el = t.closest('[data-pm]'))) { ui.pmode = el.dataset.pm; postUpdate(); syncToolbar(); if (ui.section === 'design' || ui.section === 'links') renderInsp(); return; }
  if ((el = t.closest('[data-cat]'))) { ui.cat = el.dataset.cat; renderPanel(); renderInsp(); if (matchMedia('(max-width:1239px)').matches) $('#insp').scrollIntoView({ behavior: 'smooth' }); return; }
  if ((el = t.closest('[data-select]'))) { ui.sel = el.dataset.select; $$('#panel .row').forEach(r => r.classList.toggle('sel', r.dataset.id === ui.sel)); renderInsp(); toPreview({ t: 'focus', id: ui.sel }); if (matchMedia('(max-width:1239px)').matches) $('#insp').scrollIntoView({ behavior: 'smooth' }); return; }
  if ((el = t.closest('[data-reset]'))) { const p = el.dataset.reset; setv(p, clone(defOf(p))); renderEditing(); return; }
  if ((el = t.closest('[data-clear]'))) { setv(el.dataset.clear, ''); renderEditing(); return; }
  if ((el = t.closest('button[data-path][data-val]'))) {
    const p = el.dataset.path; let v = el.dataset.val; if (el.dataset.t === 'num') v = parseFloat(v);
    setv(p, v); $$('button[data-path="' + p + '"]').forEach(b => { const on = String(b.dataset.val) === String(v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const rs = $('.rs[data-reset="' + p + '"]'); if (rs) rs.hidden = isDef(p);
    const rr = el.dataset.rr; if (rr === 'insp') renderInsp(); else if (rr === 'panel') renderPanel(); if (ui.section === 'design') renderPanel();
    return;
  }
  if ((el = t.closest('[data-act]'))) { onAct(el.dataset.act, el); return; }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('.media[data-drop]'); if (d) { e.preventDefault(); d.classList.add('drop-on'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('.media[data-drop]'); if (d) d.classList.remove('drop-on'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('.media[data-drop]'); if (d) { e.preventDefault(); d.classList.remove('drop-on'); handleFile(d.dataset.drop, e.dataTransfer.files[0], d.dataset); } });
window.addEventListener('message', e => {
  const m = e.data; if (!m || m.__lb !== 1 || e.source !== ($('#pv') || {}).contentWindow) return;
  if (m.t === 'mode') { ui.pmode = m.mode; syncToolbar(); if (ui.section === 'design') renderInsp(); }
  else if (m.t === 'edit') {
    if (m.kind === 'link') { ui.section = 'links'; ui.linkTab = 'links'; ui.sel = m.id; }
    else if (m.kind === 'social') { ui.section = 'links'; ui.linkTab = 'social'; }
    else ui.section = 'profile';
    ui.view = matchMedia('(max-width:1239px)').matches ? 'edit' : ui.view;
    renderAll(); const r = $('.row[data-id="' + m.id + '"]'); if (r) r.scrollIntoView({ block: 'nearest' });
  }
});
window.addEventListener('resize', () => fitFrame());

async function init() {
  skeleton();
  await loadProject();
  if (!ui.had && /^https?:/.test(location.protocol)) { try { const r = await fetch('projekt.json', { cache: 'no-store' }); if (r.ok) await loadProjectText(await r.text()); } catch (er) { } }
  if (S.design.siteMode === 'light' && !ui.pmode) ui.pmode = 'light';
  applyEd(); hpush(null);
  renderAll(); mountPreview();
  if ('ResizeObserver' in window) new ResizeObserver(() => fitFrame()).observe($('#stageBody'));
  setSaveState(false);
  const ph = new URLSearchParams(location.search); void ph;
}
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded', init);else init();
window.LBApp = { get S() { return S; }, set S(v) { S = v; }, media, ui, exportSite: () => LB.exportSite(S, id => media.get(id)) };

</script></body></html>
